<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cazamichis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Shantell+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: mapa de cuadras a pantalla completa, álbum de figuritas con gingham, hoja inferior para capturar. Bordes negros y sombra dura. */
:root{
  --bg:#FAF6F8; --ink:#17151A; --muted:#6B6571; --card:#FFFFFF; --line:#E6DDE3;
  --gh-a:#F2B3B0; --gh-b:#F5BE96; --gh-c:#B9C6F6;
  --blue:#3F5BE0; --gold:#F0BE3C;
  --map-street:#FBF9FA; --map-block:#E3DEE6; --map-plaza:#CDE6C7;
  --tagbg:#111013; --tagfg:#FFFFFF;
  --f-display:'Shantell Sans','Comic Sans MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141217; --ink:#F3EEF2; --muted:#A39CAA; --card:#1F1C25; --line:#35303D;
  --gh-a:#9C5662; --gh-b:#A66E49; --gh-c:#5E6DB8;
  --blue:#8DA0FF; --gold:#F0BE3C;
  --map-street:#17141B; --map-block:#2A2631; --map-plaza:#27412E;
  --tagbg:#0B0A0D; --tagfg:#FFFFFF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141217; --ink:#F3EEF2; --muted:#A39CAA; --card:#1F1C25; --line:#35303D;
  --gh-a:#9C5662; --gh-b:#A66E49; --gh-c:#5E6DB8;
  --blue:#8DA0FF; --gold:#F0BE3C;
  --map-street:#17141B; --map-block:#2A2631; --map-plaza:#27412E;
  --tagbg:#0B0A0D; --tagfg:#FFFFFF; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,p{margin:0}
h2{text-wrap:balance}

#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* encabezado */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 12px;border-bottom:2px solid var(--ink);position:relative;background:var(--bg)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:8px;border-bottom:2px solid var(--ink);z-index:2;pointer-events:none;
  background-color:var(--card);
  background-image:linear-gradient(90deg,color-mix(in srgb,var(--gh-a) 70%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--gh-a) 70%,transparent) 50%,transparent 50%);
  background-size:8px 8px}
.word{font:800 24px/1 var(--f-display);letter-spacing:-.01em}
.lvl{display:grid;gap:4px;justify-items:end;min-width:0}
.lvl-t{font:600 12px/1 var(--f-body);color:var(--muted);white-space:nowrap}
.lvl-t b{color:var(--ink);font-weight:700}
.xp{width:96px;height:8px;border:2px solid var(--ink);border-radius:6px;background:var(--card);overflow:hidden}
.xp i{display:block;height:100%;background:var(--blue)}

main{flex:1;min-height:0;position:relative}
#v-map,#v-album{position:absolute;inset:0}
#map{display:block;touch-action:none;width:100%;height:100%;cursor:grab}
#map:active{cursor:grabbing}

/* paneles sobre el mapa */
.box{background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.legend{position:absolute;left:16px;top:22px;padding:8px 12px;display:grid;gap:5px;font:600 12px/1.2 var(--f-body)}
.legend div{display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--blue)}
.dot.me{background:var(--blue);border-color:#fff;box-shadow:0 0 0 2px var(--ink)}
.ctl{position:absolute;right:16px;top:22px;display:grid;gap:10px}
.ib{width:44px;height:44px;display:grid;place-items:center;padding:0;background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.ib:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ib svg,.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pickbar{position:absolute;left:16px;right:16px;bottom:18px;max-width:520px;margin-inline:auto;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gold);color:#17151A;border-color:#17151A;box-shadow:3px 3px 0 #17151A;font-weight:600}

/* barra inferior */
.bar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;padding:6px 16px 8px;background:var(--bg);border-top:2px solid var(--ink);position:relative;z-index:3}
.nb{display:grid;justify-items:center;gap:3px;padding:6px 4px;background:none;border:0;font:600 12px/1 var(--f-body);color:var(--muted)}
.nb[aria-current="page"]{color:var(--ink)}
.nb[aria-current="page"] svg{stroke-width:2.6}
.shot{width:68px;height:68px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:var(--tagbg);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--blue);padding:0}
.shot svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shot:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--blue)}

/* álbum */
#v-album{overflow:auto;padding:26px 16px 32px;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin-inline:auto;display:grid;gap:18px}
.al-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.al-h h2{font:800 26px/1.1 var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 8px}
.stat{display:grid;gap:2px;justify-items:center;min-width:0;text-align:center}
.stat b{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font:600 11px/1.2 var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sec{font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.tile{position:relative;display:grid;justify-items:center;gap:4px;padding:8px 4px 7px;background:var(--card);border:2px solid var(--ink);border-radius:12px;font:600 11px/1.2 var(--f-body);color:var(--ink);min-width:0}
.tile img{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.tile span{max-width:100%;text-align:center;overflow-wrap:anywhere}
.tile.lock img{filter:grayscale(1) brightness(.35);opacity:.45}
.tile.lock{border-style:dashed;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--gold);color:#17151A;border-color:#17151A}
.tile b{position:absolute;top:-8px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--blue);color:#fff;border:2px solid var(--ink);font:700 11px/16px var(--f-body);text-align:center}
:root[data-theme="dark"] .tile b{color:#10131f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile b{color:#10131f}}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.fig{position:relative;display:flex;flex-direction:column;gap:9px;padding:10px;min-width:0;text-align:left;color:var(--ink);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);
  background-color:var(--card);
  background-image:linear-gradient(90deg,color-mix(in srgb,var(--gh) 55%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--gh) 55%,transparent) 50%,transparent 50%);
  background-size:22px 22px}
.fig:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.fig-img{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink);border-radius:10px;background:var(--card);display:block}
.fig-no{position:absolute;top:17px;left:17px;padding:1px 7px;border:2px solid var(--ink);border-radius:7px;background:var(--card);font:700 11px/1.4 var(--f-body);font-variant-numeric:tabular-nums}
.tag{align-self:flex-start;max-width:100%;padding:3px 10px;border-radius:3px;background:var(--tagbg);color:var(--tagfg);font:700 15px/1.3 var(--f-display);transform:rotate(-1.5deg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fig-m{align-self:flex-start;padding:1px 8px;border-radius:8px;background:var(--card);border:2px solid var(--ink);font:600 12px/1.5 var(--f-body)}
.empty{padding:22px 18px;text-align:center;display:grid;gap:6px}
.empty b{font:800 18px/1.2 var(--f-display)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-size:13px;color:var(--muted);flex:1 1 240px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);font:700 15px/1.2 var(--f-body)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-big{min-height:54px;font-size:16px;width:100%}
.btn-sm{min-height:36px;padding:4px 12px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn-danger{background:#D63A3A;color:#fff;border-color:var(--ink)}

/* hoja inferior */
#scrim{position:fixed;inset:0;background:rgba(10,8,14,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;max-height:90%;margin-inline:auto;overflow:auto;background:var(--bg);border:2px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));outline:0;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.ib:active,.btn:active,.fig:active,.shot:active{transform:none}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-t{font:800 22px/1.2 var(--f-display);margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:14px}
.stack{display:grid;gap:12px;padding-bottom:6px}
.row{display:flex;gap:12px;margin-top:16px}
.row .btn{flex:1}
label,.lab{display:block;font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
input[type=text],textarea{width:100%;padding:10px 12px;background:var(--card);border:2px solid var(--ink);border-radius:10px;font:500 16px/1.3 var(--f-body)}
textarea{resize:vertical}
.new-top{display:flex;gap:14px;align-items:flex-start}
.new-top > div{flex:1;min-width:0}
.new-top label{margin-top:0}
.new-img{width:104px;height:104px;object-fit:cover;border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);flex:none;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;min-height:40px;background:var(--card);border:2px solid var(--ink);border-radius:20px;font:600 13px/1 var(--f-body)}
.chip img{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink)}
.chip i{font-style:normal;color:var(--muted);font-size:11px}
.chip[aria-checked="true"]{background:var(--gold);color:#17151A;border-color:#17151A}
.chip[aria-checked="true"] i{color:#17151A}
.loc{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.loc p{flex:1 1 200px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.det-top{position:relative}
.det-img{width:100%;max-height:46vh;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);display:block;background:var(--card)}
.badge{position:absolute;top:10px;left:10px;padding:2px 9px;border:2px solid var(--ink);border-radius:8px;background:var(--card);font:700 12px/1.5 var(--f-body)}
.meta{margin-top:12px;font-weight:600}
.coords{margin-top:2px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.notes{margin-top:10px}
.ex{margin-top:10px;display:inline-block;padding:2px 10px;border:2px dashed var(--ink);border-radius:8px;font:600 12px/1.5 var(--f-body)}

#toast{position:absolute;left:16px;right:16px;bottom:96px;max-width:440px;margin-inline:auto;z-index:30;padding:10px 14px;font-weight:600;text-align:center;pointer-events:none}
</style>

<div id="app">
  <header class="top">
    <h1 class="word">Cazamichis</h1>
    <div class="lvl" aria-live="polite">
      <span class="lvl-t" id="lvl-t"></span>
      <div class="xp" role="progressbar" aria-label="Experiencia" aria-valuemin="0" aria-valuemax="100" id="xp"><i id="xp-i"></i></div>
    </div>
  </header>

  <main>
    <section id="v-map" aria-label="Mapa de michis">
      <canvas id="map" aria-label="Mapa de cuadras con los michis capturados"></canvas>
      <div class="legend box" aria-hidden="true">
        <div><span class="dot"></span>Capturado</div>
        <div><span class="dot me"></span>Vos</div>
      </div>
      <div class="ctl">
        <button class="ib" data-act="locate" aria-label="Ir a mi ubicación"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
        <button class="ib" data-act="zin" aria-label="Acercar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ib" data-act="zout" aria-label="Alejar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
      <div id="pickbar" class="box" hidden><span id="pickmsg"></span><button class="btn btn-sm" data-act="cancelpick">Cancelar</button></div>
    </section>
    <section id="v-album" aria-label="Álbum" hidden></section>
  </main>

  <nav class="bar" aria-label="Secciones">
    <button class="nb" data-act="tab" data-t="map" aria-current="page"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
    <button class="shot" data-act="shot" aria-label="Cazar un michi"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="nb" data-act="tab" data-t="album" aria-current="false"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M12 8h4"/></svg>Álbum</button>
  </nav>

  <div id="scrim" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Michi" tabindex="-1" hidden>
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </div>
  <div id="toast" class="box" role="status" aria-live="polite" hidden></div>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<input type="file" id="restore" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v))};
var pad=function(n){return String(n).padStart(3,'0')};

/* ---------- pelajes (la "Michidex") ---------- */
var FURS=[
 {k:'atigrado',n:'Atigrado',s:1,c:'#8C6C4D',c2:'#4A3626'},
 {k:'naranja',n:'Naranja',s:1,c:'#E8923F',c2:'#B8601A'},
 {k:'bicolor',n:'Blanco y negro',s:1,c:'#1F1E23',c2:'#FFFFFF'},
 {k:'negro',n:'Negro',s:2,c:'#27252C',c2:'#111111'},
 {k:'blanco',n:'Blanco',s:2,c:'#F6F3F4',c2:'#D8D2D6'},
 {k:'gris',n:'Gris',s:2,c:'#9C9AA5',c2:'#6F6D78'},
 {k:'tricolor',n:'Tricolor',s:3,c:'#F4EEE9',c2:'#E8923F',c3:'#27252C'},
 {k:'siames',n:'Siamés',s:3,c:'#EADFCD',c2:'#4B3B33'}
];
var FUR={};FURS.forEach(function(f){FUR[f.k]=f});
var RARITY=['','Común','Poco común','Raro'];
var LEVELS=['Curioso','Cazagatos','Rastreador','Susurragatos','Maestro michi','Leyenda de la cuadra'];
var NAMES=['Tigre','Manchita','Bigotes','Pelusa','Milanesa','Fideo','Dulce de Leche','Garrita','Chiquito','Mate','Ñoqui','Sultán','Churro','Tano','Empanada'];

var avCache={};
function catSVG(k){
  if(avCache[k])return avCache[k];
  var f=FUR[k]||FURS[0],b=f.c,ear=b,x='';
  if(k==='atigrado')x='<path d="M50 32v9M41 34l2 8M59 34l-2 8M22 58h9M24 66h8M78 58h-9M76 66h-8" stroke="'+f.c2+'" stroke-width="3.2" stroke-linecap="round"/>';
  if(k==='naranja')x='<path d="M50 32v9M41 34l2 8M59 34l-2 8" stroke="'+f.c2+'" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="50" cy="68" rx="12" ry="8" fill="#F6C791"/>';
  if(k==='bicolor')x='<path d="M50 28L42 56h16Z" fill="#fff"/><ellipse cx="50" cy="69" rx="16" ry="11" fill="#fff"/>';
  if(k==='gris')x='<path d="M50 32v8M42 34l2 7M58 34l-2 7" stroke="'+f.c2+'" stroke-width="2.6" stroke-linecap="round"/>';
  if(k==='tricolor')x='<ellipse cx="33" cy="46" rx="14" ry="12" fill="'+f.c2+'"/><ellipse cx="68" cy="44" rx="13" ry="11" fill="'+f.c3+'"/>';
  if(k==='siames'){ear=f.c2;x='<ellipse cx="50" cy="66" rx="17" ry="13" fill="'+f.c2+'"/><path d="M50 36L44 54h12Z" fill="'+f.c2+'"/>'}
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#F7D6D3"/>'
  +'<polygon points="21,48 25,11 49,32" fill="'+ear+'"/><polygon points="79,48 75,11 51,32" fill="'+ear+'"/>'
  +'<polygon points="28,38 29,21 41,31" fill="#F2A7B0"/><polygon points="72,38 71,21 59,31" fill="#F2A7B0"/>'
  +'<clipPath id="h"><ellipse cx="50" cy="58" rx="32" ry="28"/></clipPath>'
  +'<ellipse cx="50" cy="58" rx="32" ry="28" fill="'+b+'"/><g clip-path="url(#h)">'+x+'</g>'
  +'<ellipse cx="37" cy="54" rx="5.5" ry="6" fill="#E9D35B"/><ellipse cx="63" cy="54" rx="5.5" ry="6" fill="#E9D35B"/>'
  +'<ellipse cx="37" cy="54" rx="1.6" ry="4.6" fill="#161416"/><ellipse cx="63" cy="54" rx="1.6" ry="4.6" fill="#161416"/>'
  +'<path d="M46 65h8l-4 4.5Z" fill="#F2A7B0"/>'
  +'<path d="M50 69.5q-4 5-9 2M50 69.5q4 5 9 2" stroke="#161416" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
  +'<path d="M30 66l-14-3M30 70l-13 4M70 66l14-3M70 70l13 4" stroke="#8d8790" stroke-width="1.1" stroke-linecap="round"/></svg>';
  return avCache[k]='data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

/* ---------- coordenadas: metros alrededor de un origen ---------- */
var LAT0=-34.7608,LNG0=-58.4036;
var M_LAT=110574,M_LNG=111320*Math.cos(LAT0*Math.PI/180);
function toXY(lat,lng){return {x:(lng-LNG0)*M_LNG,y:(lat-LAT0)*M_LAT}}
function toLL(x,y){return {lat:LAT0+y/M_LAT,lng:LNG0+x/M_LNG}}
function fmt(n){return n.toLocaleString('es-AR',{minimumFractionDigits:5,maximumFractionDigits:5})}

/* ---------- estado ---------- */
var michis=[],me=null,selected=null,pickMode=null,draft=null,filter=null,tab='map';
var view={cx:0,cy:0,mpp:1.8};
var sheetKind=null,detailId=null,confirmDel=false,dlns=null;
var T0=Date.now();

/* ---------- guardado en el navegador (best effort) ---------- */
var dbp=null;
function dbOpen(){
  if(dbp)return dbp;
  dbp=new Promise(function(res){
    try{var r=indexedDB.open('cazamichis',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('michis',{keyPath:'id'})};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)};r.onblocked=function(){res(null)};
    }catch(e){res(null)}
  });
  return dbp;
}
function tx(mode,fn){
  return dbOpen().then(function(db){
    if(!db)return null;
    return new Promise(function(res){
      try{var t=db.transaction('michis',mode),r=fn(t.objectStore('michis'));
        t.oncomplete=function(){res(r&&r.result!==undefined?r.result:true)};
        t.onerror=function(){res(null)};t.onabort=function(){res(null)};
      }catch(e){res(null)}
    });
  });
}
function persist(m){return tx('readwrite',function(s){return s.put(m)})}
function unpersist(id){return tx('readwrite',function(s){return s.delete(id)})}

function makeExamples(){
  var base=[['Pelusa','gris',-120,90,'Dormía arriba de un auto.'],['Tigre','atigrado',60,-140,''],['Milanesa','naranja',210,60,'Se dejó acariciar.'],['Ñoqui','bicolor',-260,-70,''],['Sombra','negro',-30,-210,'']];
  return base.map(function(b,i){var ll=toLL(b[2],b[3]);
    return {id:'ej'+i,no:i+1,name:b[0],fur:b[1],notes:b[4],photo:catSVG(b[1]),lat:ll.lat,lng:ll.lng,at:Math.round(T0-(5-i)*86400000*1.3),example:true}});
}

/* ---------- nivel y experiencia ---------- */
function stats(){
  var seen={},xp=0;
  michis.slice().sort(function(a,b){return a.at-b.at}).forEach(function(m){
    var f=FUR[m.fur];if(!f)return;xp+=10+5*f.s;if(!seen[m.fur]){seen[m.fur]=1;xp+=20}
  });
  var lv=Math.floor(xp/60);
  return {xp:xp,lv:lv,pct:(xp%60)/60*100,furs:Object.keys(seen).length};
}
function renderHeader(){
  var s=stats();
  $('#lvl-t').innerHTML='Nv '+(s.lv+1)+' · <b>'+LEVELS[Math.min(s.lv,LEVELS.length-1)]+'</b>';
  $('#xp-i').style.width=s.pct+'%';
  $('#xp').setAttribute('aria-valuenow',Math.round(s.pct));
}

/* ---------- mapa de cuadras ---------- */
var cv=$('#map'),ctx=cv.getContext('2d'),W=0,H=0,dpr=1,pend=false;
var imgs={};
function getImg(m){var i=imgs[m.id];if(!i||i.__src!==m.photo){i=new Image();i.__src=m.photo;i.onload=dirty;i.src=m.photo;imgs[m.id]=i}return i}
function dirty(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;draw()})}
function resize(){
  var r=cv.parentElement.getBoundingClientRect();
  if(!r.width||!r.height)return;
  dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);dirty();
}
if(window.ResizeObserver)new ResizeObserver(resize).observe($('#v-map'));else window.addEventListener('resize',resize);
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',dirty)}catch(e){}
try{new MutationObserver(dirty).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}

function tokens(){
  var s=getComputedStyle(document.documentElement);
  function g(n){return s.getPropertyValue(n).trim()}
  return {street:g('--map-street'),block:g('--map-block'),plaza:g('--map-plaza'),ink:g('--ink'),blue:g('--blue'),gold:g('--gold'),card:g('--card')};
}
function pinR(){return view.mpp>6?13:25}
function scr(m){var p=toXY(m.lat,m.lng);return {x:W/2+(p.x-view.cx)/view.mpp,y:H/2-(p.y-view.cy)/view.mpp}}

function draw(){
  if(!W||!H)return;
  var T=tokens(),mpp=view.mpp;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=T.street;ctx.fillRect(0,0,W,H);
  var x0=view.cx-W/2*mpp,x1=view.cx+W/2*mpp,y0=view.cy-H/2*mpp,y1=view.cy+H/2*mpp;
  var i0=Math.floor(x0/100),i1=Math.floor(x1/100),j0=Math.floor(y0/100),j1=Math.floor(y1/100);
  function gap(k){return (k%5===0)?Math.max(15,1.8*mpp):Math.max(7,1.2*mpp)}
  for(var i=i0;i<=i1;i++){
    var gl=gap(i),gr=gap(i+1),bx=i*100+gl,bw=100-gl-gr;if(bw<=0)continue;
    for(var j=j0;j<=j1;j++){
      var gb=gap(j),gt=gap(j+1),by=j*100+gb,bh=100-gb-gt;if(bh<=0)continue;
      var sx=(bx-x0)/mpp,sy=(y1-(by+bh))/mpp,w=bw/mpp,h=bh/mpp;
      var plaza=((((i*73856093)^(j*19349663))>>>0)%13)===0;
      ctx.fillStyle=plaza?T.plaza:T.block;
      if(w>16&&ctx.roundRect){ctx.beginPath();ctx.roundRect(sx,sy,w,h,Math.min(7,w*0.1));ctx.fill()}
      else ctx.fillRect(sx,sy,w,h);
    }
  }
  /* escala */
  var nice=[10,20,50,100,200,500,1000,2000,5000],L=10;
  nice.forEach(function(n){if(n/mpp<=110)L=n});
  var px=L/mpp,bx0=16,by0=H-16;
  ctx.font='600 11px Figtree, system-ui, sans-serif';ctx.textBaseline='alphabetic';
  var label=(L>=1000?(L/1000)+' km':L+' m')+' · 1 cuadra = 100 m';
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle=T.street;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(bx0,by0-5);ctx.lineTo(bx0,by0);ctx.lineTo(bx0+px,by0);ctx.lineTo(bx0+px,by0-5);ctx.stroke();
  ctx.lineWidth=4;ctx.strokeText(label,bx0,by0-9);
  ctx.strokeStyle=T.ink;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(bx0,by0-5);ctx.lineTo(bx0,by0);ctx.lineTo(bx0+px,by0);ctx.lineTo(bx0+px,by0-5);ctx.stroke();
  ctx.fillStyle=T.ink;ctx.fillText(label,bx0,by0-9);
  /* yo */
  if(me){
    var mx=W/2+(me.x-view.cx)/mpp,my=H/2-(me.y-view.cy)/mpp;
    ctx.beginPath();ctx.arc(mx,my,12,0,7);ctx.fillStyle=T.blue;ctx.globalAlpha=.25;ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(mx,my,7,0,7);ctx.fillStyle=T.blue;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.lineWidth=1.5;ctx.strokeStyle=T.ink;ctx.beginPath();ctx.arc(mx,my,8.7,0,7);ctx.stroke();
  }
  /* michis */
  var r=pinR(),list=michis.map(function(m){var p=scr(m);return {m:m,x:p.x,y:p.y}}).sort(function(a,b){return a.y-b.y});
  list.forEach(function(o){
    if(o.x<-40||o.x>W+40||o.y<-20||o.y>H+80)return;
    var sel=o.m.id===selected,R=sel?r+4:r,cy=o.y-R-6;
    ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x-7,cy+R-3);ctx.lineTo(o.x+7,cy+R-3);ctx.closePath();
    ctx.fillStyle=sel?T.gold:T.blue;ctx.fill();
    ctx.beginPath();ctx.arc(o.x,cy,R+4,0,7);ctx.fillStyle=sel?T.gold:T.blue;ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=T.ink;ctx.stroke();
    ctx.beginPath();ctx.arc(o.x,cy,R,0,7);ctx.fillStyle=T.card;ctx.fill();
    var im=getImg(o.m);
    if(im.complete&&im.naturalWidth){
      ctx.save();ctx.beginPath();ctx.arc(o.x,cy,R-1,0,7);ctx.clip();
      var s=Math.min(im.naturalWidth,im.naturalHeight);
      ctx.drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,o.x-R,cy-R,R*2,R*2);ctx.restore();
    }
  });
}
function hitPin(x,y){
  var r=pinR(),best=null,bd=1e9;
  michis.forEach(function(m){
    var p=scr(m),R=(m.id===selected?r+4:r),cy=p.y-R-6,d=Math.hypot(x-p.x,y-cy);
    if(d<=R+8&&d<bd){bd=d;best=m}
  });
  return best;
}
function zoomAt(sx,sy,f){
  var wx=view.cx+(sx-W/2)*view.mpp,wy=view.cy-(sy-H/2)*view.mpp;
  var n=clamp(view.mpp/f,0.3,10);
  view.cx=wx-(sx-W/2)*n;view.cy=wy+(sy-H/2)*n;view.mpp=n;dirty();
}
function centerOn(m,mpp){var p=toXY(m.lat,m.lng);view.cx=p.x;view.cy=p.y;if(mpp)view.mpp=clamp(view.mpp,0.3,mpp);dirty()}

var ptrs=new Map(),lastPinch=0,moved=0,downT=0;
function pos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',function(e){
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,pos(e));if(ptrs.size===1){moved=0;downT=Date.now()}
  if(ptrs.size===2){var v=Array.from(ptrs.values());lastPinch=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)}
});
cv.addEventListener('pointermove',function(e){
  if(!ptrs.has(e.pointerId))return;
  var p=pos(e),o=ptrs.get(e.pointerId);
  if(ptrs.size===1){
    var dx=p.x-o.x,dy=p.y-o.y;view.cx-=dx*view.mpp;view.cy+=dy*view.mpp;moved+=Math.abs(dx)+Math.abs(dy);ptrs.set(e.pointerId,p);dirty();
  }else if(ptrs.size===2){
    ptrs.set(e.pointerId,p);var v=Array.from(ptrs.values()),d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
    if(lastPinch>0&&d>0)zoomAt((v[0].x+v[1].x)/2,(v[0].y+v[1].y)/2,d/lastPinch);
    lastPinch=d;moved+=20;
  }
});
function endPtr(e,tap){
  if(!ptrs.has(e.pointerId))return;
  var p=pos(e),was=ptrs.size;
  ptrs.delete(e.pointerId);if(ptrs.size<2)lastPinch=0;
  if(tap&&was===1&&moved<8&&Date.now()-downT<500)onTap(p.x,p.y);
}
cv.addEventListener('pointerup',function(e){endPtr(e,true)});
cv.addEventListener('pointercancel',function(e){endPtr(e,false)});
cv.addEventListener('wheel',function(e){e.preventDefault();var p=pos(e);zoomAt(p.x,p.y,e.deltaY>0?1/1.18:1.18)},{passive:false});

function onTap(x,y){
  if(pickMode){
    var wx=view.cx+(x-W/2)*view.mpp,wy=view.cy-(y-H/2)*view.mpp;
    if(pickMode==='sighting'){var ll=toLL(wx,wy);draft.loc={lat:ll.lat,lng:ll.lng};draft.locSrc='mapa';endPick();openSheet('new')}
    else{me={x:wx,y:wy};endPick();toast('Listo, te marqué en el mapa.');dirty()}
    return;
  }
  var h=hitPin(x,y);
  if(h){selected=h.id;dirty();openSheet('detail',h.id)}
  else if(selected){selected=null;dirty()}
}
function startPick(mode){
  pickMode=mode;
  $('#pickmsg').textContent=mode==='sighting'?'Tocá el mapa donde viste al michi.':'No pude usar el GPS desde acá. Tocá el mapa donde estás.';
  $('#pickbar').hidden=false;closeSheet(true);show('map');
}
function endPick(){pickMode=null;$('#pickbar').hidden=true}

/* ---------- ubicación y foto ---------- */
function getPos(){
  return new Promise(function(res){
    try{
      if(!navigator.geolocation)return res(null);
      var done=false,t=setTimeout(function(){if(!done){done=true;res(null)}},7000);
      navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude})},
        function(){if(done)return;done=true;clearTimeout(t);res(null)},{enableHighAccuracy:true,timeout:6000,maximumAge:30000});
    }catch(e){res(null)}
  });
}
function readExifGps(buf){
  var v=new DataView(buf);
  if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return null;
  var off=2;
  while(off<v.byteLength-4){
    var marker=v.getUint16(off);off+=2;
    if(marker===0xFFE1){
      if(v.getUint32(off+2)===0x45786966)return parseTiff(v,off+8);
      off+=v.getUint16(off);
    }else if((marker&0xFF00)===0xFF00&&marker!==0xFFDA){off+=v.getUint16(off)}
    else break;
  }
  return null;
}
function parseTiff(v,start){
  var little=v.getUint16(start)===0x4949;
  var u16=function(o){return v.getUint16(o,little)},u32=function(o){return v.getUint32(o,little)};
  var ifd0=start+u32(start+4),n=u16(ifd0),gps=0,i;
  for(i=0;i<n;i++){var e=ifd0+2+i*12;if(u16(e)===0x8825)gps=start+u32(e+8)}
  if(!gps)return null;
  var m=u16(gps),t={};
  for(i=0;i<m;i++){
    var en=gps+2+i*12,tag=u16(en);
    if(tag===1||tag===3)t[tag]=String.fromCharCode(v.getUint8(en+8));
    else if(tag===2||tag===4){
      var p=start+u32(en+8),a=[];
      for(var k=0;k<3;k++){var d=u32(p+k*8+4);a.push(d?u32(p+k*8)/d:0)}
      t[tag]=a;
    }
  }
  if(!t[2]||!t[4])return null;
  var lat=t[2][0]+t[2][1]/60+t[2][2]/3600,lng=t[4][0]+t[4][1]/60+t[4][2]/3600;
  if(t[1]==='S')lat=-lat;if(t[3]==='W')lng=-lng;
  if(!isFinite(lat)||!isFinite(lng)||(lat===0&&lng===0)||Math.abs(lat)>90||Math.abs(lng)>180)return null;
  return {lat:lat,lng:lng};
}
function processFile(file){
  return file.arrayBuffer().then(function(buf){
    var gps=null;try{gps=readExifGps(buf)}catch(e){}
    var url=URL.createObjectURL(file);
    return new Promise(function(ok,ko){var i=new Image();i.onload=function(){ok(i)};i.onerror=ko;i.src=url})
      .then(function(img){
        var mx=720,s=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight));
        var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
        return {photo:c.toDataURL('image/jpeg',0.82),gps:gps};
      });
  });
}
function onFile(input,source){
  var file=input.files&&input.files[0];input.value='';
  if(!file)return;
  toast('Procesando la foto…',true);
  processFile(file).then(function(r){
    var loc=r.gps,src=loc?'foto':null;
    return (loc||source!=='camera'?Promise.resolve(null):getPos()).then(function(g){
      if(g){loc=g;src='GPS'}
      draft={photo:r.photo,loc:loc,locSrc:src,name:'',fur:null,notes:'',hint:NAMES[Math.floor(Math.random()*NAMES.length)]};
      hideToast();openSheet('new');
    });
  }).catch(function(){toast('No pude leer esa foto. Probá con otra.')});
}

/* ---------- hoja inferior ---------- */
function openSheet(kind,id){
  sheetKind=kind;detailId=id||null;confirmDel=false;renderSheet();
  $('#scrim').hidden=false;$('#sheet').hidden=false;
  try{$('#sheet').focus({preventScroll:true})}catch(e){}
}
function closeSheet(keepDraft){
  $('#scrim').hidden=true;$('#sheet').hidden=true;
  if(sheetKind==='new'&&!keepDraft)draft=null;
  if(sheetKind==='detail'){selected=null;dirty()}
  sheetKind=null;
}
function renderSheet(){
  var b=$('#sheetBody'),s=$('#sheet');
  if(sheetKind==='pick'){s.setAttribute('aria-label','Cazar un michi');b.innerHTML=
    '<h2 class="sh-t">Cazar un michi</h2><p class="sub">Sacale una foto de cerca. Si tu teléfono guarda el lugar en la foto, el michi queda en el mapa solo.</p>'
    +'<div class="stack"><button class="btn btn-primary btn-big" data-act="cam">Sacar foto</button><button class="btn btn-big" data-act="gal">Elegir de la galería</button></div>'}
  else if(sheetKind==='new'){s.setAttribute('aria-label','Nuevo michi');b.innerHTML=sheetNew()}
  else if(sheetKind==='detail'){var m=michis.find(function(x){return x.id===detailId});if(!m){closeSheet();return}s.setAttribute('aria-label','Michi '+m.name);b.innerHTML=sheetDetail(m)}
}
function locText(d){
  if(!d.loc)return 'Todavía sin ubicación. Marcá en el mapa dónde lo viste.';
  var w=d.locSrc==='foto'?'Ubicación tomada de la foto':d.locSrc==='GPS'?'Ubicación por GPS':'Marcado en el mapa';
  return w+' · '+fmt(d.loc.lat)+', '+fmt(d.loc.lng);
}
function sheetNew(){
  var d=draft;
  return '<h2 class="sh-t">Nuevo michi</h2>'
  +'<div class="new-top"><img class="new-img" src="'+esc(d.photo)+'" alt="Foto del michi"><div><label for="f-name">Nombre</label><input id="f-name" type="text" maxlength="30" autocomplete="off" placeholder="'+esc(d.hint)+'" value="'+esc(d.name)+'"></div></div>'
  +'<p class="lab" id="lab-fur">Pelaje</p><div class="chips" role="radiogroup" aria-labelledby="lab-fur">'
  +FURS.map(function(f){return '<button type="button" class="chip" role="radio" aria-checked="'+(d.fur===f.k)+'" data-act="fur" data-k="'+f.k+'"><img src="'+catSVG(f.k)+'" alt=""><span>'+f.n+'</span><i>'+'★'.repeat(f.s)+'</i></button>'}).join('')+'</div>'
  +'<p class="lab">Dónde lo viste</p><div class="loc"><p id="loc-t">'+esc(locText(d))+'</p><button class="btn btn-sm" data-act="pickloc">Marcar en el mapa</button></div>'
  +'<label for="f-notes">Notas (opcional)</label><textarea id="f-notes" rows="2" maxlength="140">'+esc(d.notes)+'</textarea>'
  +'<div class="row"><button class="btn" data-act="cancelnew">Cancelar</button><button class="btn btn-primary" data-act="save">Guardar michi</button></div>';
}
function sheetDetail(m){
  var f=FUR[m.fur]||FURS[0],dt=new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date(m.at));
  return '<div class="det-top"><img class="det-img" src="'+esc(m.photo)+'" alt="Foto de '+esc(m.name)+'"><span class="badge">Nº '+pad(m.no)+'</span></div>'
  +'<label for="d-name">Nombre</label><input id="d-name" type="text" maxlength="30" value="'+esc(m.name)+'" data-id="'+esc(m.id)+'">'
  +'<p class="meta">'+f.n+' · '+'★'.repeat(f.s)+' '+RARITY[f.s]+'</p>'
  +'<p class="coords">'+esc(dt)+' · '+fmt(m.lat)+', '+fmt(m.lng)+'</p>'
  +(m.notes?'<p class="notes">'+esc(m.notes)+'</p>':'')
  +(m.example?'<span class="ex">Michi de ejemplo</span>':'')
  +(confirmDel
    ?'<p class="notes"><b>¿Eliminar a '+esc(m.name)+'?</b> No se puede deshacer.</p><div class="row"><button class="btn" data-act="delno">No, dejarlo</button><button class="btn btn-danger" data-act="delyes" data-id="'+esc(m.id)+'">Sí, eliminar</button></div>'
    :'<div class="row"><button class="btn" data-act="seemap" data-id="'+esc(m.id)+'">Ver en el mapa</button><button class="btn" data-act="del">Eliminar</button></div>');
}

/* ---------- álbum ---------- */
function renderAlbum(){
  var s=stats(),counts={},hasEx=michis.some(function(m){return m.example});
  michis.forEach(function(m){counts[m.fur]=(counts[m.fur]||0)+1});
  var list=michis.filter(function(m){return !filter||m.fur===filter}).sort(function(a,b){return b.no-a.no});
  var gh=['--gh-a','--gh-b','--gh-c'];
  var h='<div class="wrap"><div class="al-h"><h2>Mi álbum</h2></div>'
  +'<div class="box stats"><div class="stat"><b>'+michis.length+'</b><span>Michis</span></div><div class="stat"><b>'+s.furs+'/'+FURS.length+'</b><span>Pelajes</span></div><div class="stat"><b>'+(s.lv+1)+'</b><span>Nivel</span></div></div>'
  +'<p class="sec">Pelajes</p><div class="tiles">'
  +FURS.map(function(f){var c=counts[f.k]||0;
    return '<button class="tile'+(c?'':' lock')+'" data-act="filter" data-k="'+f.k+'" aria-pressed="'+(filter===f.k)+'"'+(c?'':' disabled aria-label="Pelaje sin descubrir"')+'><img src="'+catSVG(f.k)+'" alt=""><span>'+(c?f.n:'???')+'</span>'+(c?'<b>'+c+'</b>':'')+'</button>'}).join('')+'</div>';
  if(hasEx)h+='<div class="box note"><span>Algunos michis son de ejemplo, para que veas cómo queda.</span><button class="btn btn-sm" data-act="rmex">Borrar ejemplos</button></div>';
  if(!michis.length)h+='<div class="box empty"><b>Tu álbum está vacío</b><p>Tocá el botón de la cámara y sacale una foto al primer michi que veas en la calle.</p></div>';
  else if(!list.length)h+='<div class="box empty"><b>Ninguno con ese pelaje</b><p>Todavía no cazaste un michi así.</p></div>';
  else h+='<div class="cards">'+list.map(function(m,i){var f=FUR[m.fur]||FURS[0];
    return '<button class="fig" style="--gh:var('+gh[m.no%3]+')" data-act="open" data-id="'+esc(m.id)+'"><img class="fig-img" src="'+esc(m.photo)+'" alt=""><span class="fig-no">Nº '+pad(m.no)+'</span><span class="tag">'+esc(m.name)+'</span><span class="fig-m">'+f.n+' · '+'★'.repeat(f.s)+'</span></button>'}).join('')+'</div>';
  h+='<div class="foot">'+(dlns?'<button class="btn btn-sm" data-act="backup">Guardar copia</button>':'')+'<button class="btn btn-sm" data-act="restore">Restaurar copia</button><p class="hint">Tus michis quedan guardados solo en este navegador. Hacé una copia de vez en cuando.</p></div></div>';
  var el=$('#v-album'),top=el.scrollTop;el.innerHTML=h;el.scrollTop=top;
}

/* ---------- acciones ---------- */
function show(t){
  tab=t;$('#v-map').hidden=t!=='map';$('#v-album').hidden=t!=='album';
  document.querySelectorAll('.nb').forEach(function(b){b.setAttribute('aria-current',b.dataset.t===t?'page':'false')});
  if(t==='album')renderAlbum();else{resize();dirty()}
}
function renderAll(){renderHeader();if(tab==='album')renderAlbum();dirty()}
var tt;
function toast(msg,sticky){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);if(!sticky)tt=setTimeout(function(){t.hidden=true},4200)}
function hideToast(){clearTimeout(tt);$('#toast').hidden=true}

function saveNew(){
  var d=draft;if(!d)return;
  if(!d.fur){toast('Elegí el pelaje del michi.');return}
  if(!d.loc){toast('Marcá en el mapa dónde lo viste.');return}
  var f=FUR[d.fur],isNewFur=!michis.some(function(m){return m.fur===d.fur});
  var no=michis.reduce(function(a,m){return Math.max(a,m.no||0)},0)+1;
  var m={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:no,name:(d.name||'').trim()||d.hint,fur:d.fur,notes:(d.notes||'').trim(),photo:d.photo,lat:d.loc.lat,lng:d.loc.lng,at:Date.now(),example:false};
  michis.push(m);persist(m);
  draft=null;closeSheet(true);show('map');centerOn(m,2);selected=m.id;renderAll();
  toast(isNewFur?'¡Pelaje nuevo: '+f.n+'! Michi Nº '+pad(no)+' capturado.':'¡Michi Nº '+pad(no)+' capturado!');
}
function locate(){
  toast('Buscando tu ubicación…',true);
  getPos().then(function(g){
    if(g){me=toXY(g.lat,g.lng);view.cx=me.x;view.cy=me.y;view.mpp=Math.min(view.mpp,1.5);dirty();toast('Te encontré en el mapa.')}
    else{hideToast();startPick('me')}
  });
}
function backup(){
  if(!dlns)return;
  var data=JSON.stringify({app:'cazamichis',v:1,michis:michis});
  dlns.save({filename:'cazamichis-copia.json',data:data}).then(function(){toast('Copia guardada.')},function(e){if(e&&e.code!=='declined')toast('No pude guardar la copia desde acá.')});
}
function restore(file){
  if(!file)return;
  file.text().then(function(txt){
    var j=JSON.parse(txt),arr=Array.isArray(j)?j:j.michis,add=0;
    if(!Array.isArray(arr))throw 0;
    arr.forEach(function(m){
      if(!m||typeof m.id!=='string'||!FUR[m.fur]||typeof m.photo!=='string'||m.photo.indexOf('data:image/')!==0||!isFinite(m.lat)||!isFinite(m.lng))return;
      if(michis.some(function(x){return x.id===m.id}))return;
      var c={id:String(m.id).slice(0,40),no:Number(m.no)||michis.length+1,name:String(m.name||'Michi').slice(0,30),fur:m.fur,notes:String(m.notes||'').slice(0,140),photo:m.photo,lat:+m.lat,lng:+m.lng,at:Number(m.at)||Date.now(),example:!!m.example};
      michis.push(c);persist(c);add++;
    });
    renderAll();toast(add?'Recuperé '+add+(add===1?' michi.':' michis.'):'No había michis nuevos en esa copia.');
  }).catch(function(){toast('Ese archivo no parece una copia de Cazamichis.')});
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(e.target.id==='scrim'){if(sheetKind&&sheetKind!=='new')closeSheet();return}
  if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tab':show(b.dataset.t);break;
    case 'shot':openSheet('pick');break;
    case 'cam':closeSheet(true);$('#cam').click();break;
    case 'gal':closeSheet(true);$('#gal').click();break;
    case 'cancelnew':closeSheet();break;
    case 'fur':
      if(draft){draft.fur=b.dataset.k;document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-checked',c.dataset.k===draft.fur)})}break;
    case 'pickloc':startPick('sighting');break;
    case 'cancelpick':{var wasS=pickMode==='sighting';endPick();if(wasS&&draft)openSheet('new');break}
    case 'save':saveNew();break;
    case 'open':openSheet('detail',id);break;
    case 'seemap':{var m=michis.find(function(x){return x.id===id});closeSheet();if(m){show('map');centerOn(m,1.2);selected=m.id;dirty()}break}
    case 'del':confirmDel=true;renderSheet();break;
    case 'delno':confirmDel=false;renderSheet();break;
    case 'delyes':michis=michis.filter(function(x){return x.id!==id});unpersist(id);selected=null;closeSheet();renderAll();toast('Michi eliminado.');break;
    case 'filter':filter=filter===b.dataset.k?null:b.dataset.k;renderAlbum();break;
    case 'rmex':michis.filter(function(x){return x.example}).forEach(function(x){unpersist(x.id)});michis=michis.filter(function(x){return !x.example});filter=null;renderAll();break;
    case 'backup':backup();break;
    case 'restore':$('#restore').click();break;
    case 'locate':locate();break;
    case 'zin':zoomAt(W/2,H/2,1.5);break;
    case 'zout':zoomAt(W/2,H/2,1/1.5);break;
  }
});
document.addEventListener('input',function(e){
  if(!draft)return;
  if(e.target.id==='f-name')draft.name=e.target.value;
  if(e.target.id==='f-notes')draft.notes=e.target.value;
});
document.addEventListener('change',function(e){
  if(e.target.id==='d-name'){
    var m=michis.find(function(x){return x.id===e.target.dataset.id});
    if(m){m.name=e.target.value.trim()||m.name;e.target.value=m.name;persist(m);renderAll()}
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetKind&&sheetKind!=='new')closeSheet()});
$('#cam').addEventListener('change',function(e){onFile(e.target,'camera')});
$('#gal').addEventListener('change',function(e){onFile(e.target,'gallery')});
$('#restore').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';restore(f)});

/* ---------- arranque ---------- */
renderHeader();
michis=makeExamples();   /* se reemplaza si hay datos guardados */
renderAll();
dbOpen().then(function(){return tx('readonly',function(s){return s.getAll()})}).then(function(all){
  var seeded=false;try{seeded=localStorage.getItem('cm-seeded')==='1'}catch(e){}
  if(Array.isArray(all)&&all.length){michis=all}
  else if(Array.isArray(all)&&!all.length){
    if(seeded)michis=[];
    else{michis=makeExamples();michis.forEach(persist);try{localStorage.setItem('cm-seeded','1')}catch(e){}}
  }
  if(michis.length){var last=michis.slice().sort(function(a,b){return b.at-a.at})[0];centerOn(last,1.8)}
  renderAll();
});
try{
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){if(d){dlns=d;if(tab==='album')renderAlbum()}},function(){})}
}catch(e){}
})();
</script>
